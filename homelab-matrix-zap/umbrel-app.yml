repo: https://github.com/wagnerlsmartins/umbrel-app-store-homelab
support: https://github.com/wagnerlsmartins/umbrel-app-store-homelab/issues
port: 8890
gallery: []
path: ""
defaultUsername: ""
defaultPassword: ""
torOnly: false
submitter: Wagner Martins
submission: https://github.com/wagnerlsmartins/umbrel-app-store-homelab
releaseNotes: >-
  0.2.0: entra a ponte mautrix-signal, em modo só leitura (relay desligado;
  só o @wagner com login). Instalação existente: o update acrescenta a linha
  do Signal ao homeserver.yaml e sobe o contêiner; o pareamento é `!signal
  login qr` no Element. A ponte do WhatsApp não é tocada.
