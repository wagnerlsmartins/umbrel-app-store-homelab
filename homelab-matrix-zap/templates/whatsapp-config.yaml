# Template mínimo do mautrix-whatsapp para o Matrix Zap.
# O bridge completa as chaves ausentes com os defaults dele no primeiro boot
# (upgrade automático de config) e troca os "generate" por tokens aleatórios
# ao gerar o registration. Nada aqui é segredo.
homeserver:
  address: http://synapse:8008
  domain: matrix.virasistema.com

appservice:
  address: http://whatsapp:29318
  hostname: 0.0.0.0
  port: 29318
  id: whatsapp
  bot:
    username: whatsappbot
    displayname: Ponte WhatsApp
  as_token: generate
  hs_token: generate

database:
  type: sqlite3-fk-wal
  uri: file:/data/mautrix-whatsapp.db?_txlock=immediate

bridge:
  command_prefix: "!wa"
  # Modo relay: um usuário do Matrix sem login próprio (o @agente) escreve na
  # sala e a ponte entrega no WhatsApp pela linha já pareada, prefixando a
  # mensagem com o nome de quem escreveu. Ligado em 2026-08-30, quando o
  # gateway da WMI passou a operar com agente compondo mensagem.
  #
  # Ligar aqui não abre nada sozinho: a sala só passa a relayar depois de um
  # `!wa set-relay` dado por um admin dentro dela. Sala não marcada continua
  # inalcançável. Contrato de uso no home-lab, em
  # `infra/servicos/gateway-whatsapp-wmi.md`.
  relay:
    enabled: true
    admin_only: true
  permissions:
    "*": relay
    "matrix.virasistema.com": user
    "@wagner:matrix.virasistema.com": admin
